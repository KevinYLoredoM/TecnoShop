<app-superior></app-superior>

<div class="perfil-container">
  
  <div class="perfil-card">
    <div class="card-header">
      <h2>Mi Perfil</h2>
      <p>Administra tu información personal y seguridad.</p>
    </div>

    <form [formGroup]="perfilForm" (ngSubmit)="guardarCambios()" class="perfil-form">
      
      <div class="section-title">Información Personal</div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Nombres</label>
          <input type="text" formControlName="nombres" placeholder="Tus nombres">
          <span class="error" *ngIf="perfilForm.get('nombres')?.touched && perfilForm.get('nombres')?.invalid">Requerido</span>
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" formControlName="apellidos" placeholder="Tus apellidos">
          <span class="error" *ngIf="perfilForm.get('apellidos')?.touched && perfilForm.get('apellidos')?.invalid">Requerido</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" formControlName="correo" placeholder="ejemplo@correo.com">
          <span class="error" *ngIf="perfilForm.get('correo')?.touched && perfilForm.get('correo')?.invalid">Correo inválido</span>
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" formControlName="telefono" placeholder="Número celular">
        </div>
      </div>

      <div class="section-title mt-4">Cambiar Contraseña <small>(Opcional)</small></div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" formControlName="contrasena" placeholder="Dejar en blanco para mantener">
        </div>

        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input type="password" formControlName="confirmarContrasena" placeholder="Repite la nueva contraseña">
        </div>
      </div>

      <div class="alert" *ngIf="mensaje" [ngClass]="mensaje.tipo">
        {{ mensaje.texto }}
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save" [disabled]="cargando || perfilForm.invalid">
          {{ cargando ? 'Guardando...' : '💾 Guardar Cambios' }}
        </button>
      </div>

    </form>
  </div>
</div>

<app-inferior></app-inferior>
